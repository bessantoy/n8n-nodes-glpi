name: Publish to npm

# Triggered by publishing a GitHub Release (create the release with a tag like
# v0.1.1 — the leading "v" is stripped and used to set package.json's version
# before publishing, so the release tag is always the single source of truth
# for what gets published; no separate manual "bump version" step to forget).
#
# Requires a repository secret NPM_TOKEN: an npm "Automation" access token
# (npmjs.com > Access Tokens > Generate New Token > Automation), scoped to an
# account/org that owns the @bessantoy npm scope.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Set package version from the release tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - run: npm run build

      - run: npm run validate:endpoints

      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
